# Usage: copy this file into its own empty folder (e.g. ~/gutkeeper/compose.yml) and run "docker compose up -d" there.
# Relative paths like ./data start at the folder of this file.
# Quick start without .env: docker compose up -d
# One-time setup code: docker compose logs
# One account (password only), data in ./data (must be writable for user 1000)
services:
  gutkeeper:
    image: ghcr.io/jamdevlab/gutkeeper:1   # 1 = always the latest 1.x
    container_name: gutkeeper
    restart: unless-stopped
    user: "1000:1000"                       # must be able to write to ./data
    # Hardening: no capabilities, no privilege escalation, read-only file system
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    read_only: true
    tmpfs: [/tmp]
    ports:
      - "3000:3000"
    environment:
      TZ: Europe/Berlin
      # MULTIUSER: "1"                      # several accounts with name and password
      # FOOD_DEFAULT: "1"                   # "Log food" on by default
      # CORS_ORIGINS: https://localhost     # lets the Android app (APK) connect
      # BACKUP_KEEP: "30"                   # number of server backups kept
      # BACKUP_PASSWORD: ${BACKUP_PASSWORD} # encrypts server backups; put the value in a .env next to this file
    volumes:
      - ./data:/data
