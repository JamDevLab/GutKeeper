<!doctype html>
<html lang="__LANG__">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>__APP_NAME__</title>
  <meta name="description" content="__APP_DESC__">
  <meta name="robots" content="noindex, nofollow">
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#edf1f0">
  <link rel="icon" href="__ICON_192__">
  <link rel="apple-touch-icon" href="__ICON_192__">
  <link rel="stylesheet" href="style.css">
  <script src="js/pwa-early.js"></script>
</head>
<body>
  <div id="app">
    <header class="top">
      <div id="topLeft" class="topleft"></div>
      <div class="topright">
        <button id="modeBtn" class="modebtn" aria-label="Stuhl / Essen" hidden></button>
        <button id="syncBtn" class="icon" aria-label="Jetzt synchronisieren"><span id="syncLbl" class="synclbl" hidden></span><span class="dot"></span></button>
      </div>
    </header>
    <main>
      <section id="vCap" class="view"></section>
      <section id="vHist" class="view" hidden></section>
      <section id="vStat" class="view" hidden></section>
      <section id="vData" class="view" hidden></section>
    </main>
    <nav class="tabs">
      <button data-tab="cap" class="on" id="tabCap"></button>
      <button data-tab="hist" id="tabHist"></button>
      <button data-tab="stat" id="tabStat"></button>
      <button data-tab="data" id="tabData"></button>
    </nav>
  </div>
  <div id="toast" class="toast" hidden></div><!-- außerhalb von #app: #app ist fixed (eigene Ebene), sonst läge der Hinweis unter offenen Fenstern -->
  <div id="lock" class="lock" hidden></div>
  <script type="module" src="js/app.js"></script>
</body>
</html>
